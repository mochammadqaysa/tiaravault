version: '3.9'

services:
  # ─── Next.js Application ──────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: tiaravault_app
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - uploads_data:/var/tiaravault/uploads
    networks:
      - tiaravault_net
    ports:
      - "3001:3001"

volumes:
  uploads_data:
    driver: local

networks:
  tiaravault_net:
    driver: bridge
